name: release

# Builds the prebuilt agenton binaries and attaches them to the GitHub Release
# for a tag. It does NOT trigger on `push: tags`,
# because release-please creates tags with the GITHUB_TOKEN and GitHub does not
# fire workflows for token-pushed tags. Instead it is invoked two ways:
#   • automatically  — release-please.yml calls it (workflow_call) right after
#     it cuts a release, in the same run;
#   • manually       — run it from the Actions tab (workflow_dispatch) to
#     (re)build a specific tag, e.g. to backfill one.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write   # upload release assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing + notarization. If MACOS_SIGN_P12 is unset the
          # whole notarize step self-skips (see .goreleaser.yaml). See
          # docs/RELEASING.md for how to obtain and set these.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
