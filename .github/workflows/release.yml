name: release

# release-please tags vX.Y.Z and opens the GitHub Release; this job builds the
# binaries and attaches them to that release so install.sh installs a prebuilt
# agenton instead of compiling from source. Nothing here fires unless a release
# tag is pushed — i.e. only when release-please cut a version from a daemon
# feat/fix/perf commit. Docs, CI, and chore commits never tag, so never build.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # goreleaser uploads assets to the release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs full history for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
