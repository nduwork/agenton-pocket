name: release

# Builds the prebuilt agenton binaries (and the Homebrew formula) and attaches
# them to the GitHub Release for a tag. It does NOT trigger on `push: tags`,
# because release-please creates tags with the GITHUB_TOKEN and GitHub does not
# fire workflows for token-pushed tags. Instead it is invoked two ways:
#   • automatically  — release-please.yml calls it (workflow_call) right after
#     it cuts a release, in the same run;
#   • manually       — run it from the Actions tab (workflow_dispatch) to
#     (re)build a specific tag, e.g. to backfill one.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write   # upload release assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to the homebrew-tap repo. If unset, the brew
          # step is skipped (see .goreleaser.yaml) so releases still succeed.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
