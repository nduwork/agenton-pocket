name: auto-release

# Every merge to main cuts the next patch version: tag it, then publish a GitHub
# Release record with generated notes.
#
# Nothing is built and no assets are uploaded. This repo's release IS the tag
# plus the record — binaries are built locally with ./dev.sh, and archives and
# the Homebrew tap are published from a separate repo that consumes these tags.
# (GitHub always shows "Source code (zip/tar.gz)" on a release; those are links
# it generates for any tag, not artifacts this workflow produces.)
#
# Escape hatches, no config needed:
#   - put [skip release] in the commit/merge message to skip a merge
#   - want a minor/major bump? tag that commit yourself and push. This job sees
#     HEAD is already tagged, skips, and the next merge counts up from your tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize: two merges landing together must not race for the same version.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # need full history + tags to compute the bump

      - name: Decide whether to release
        id: decide
        run: |
          set -euo pipefail
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD is already tagged ($(git tag --points-at HEAD | tr '\n' ' ')) — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git log -1 --pretty=%B | grep -qF '[skip release]'; then
            echo "commit message says [skip release] — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Highest existing vMAJOR.MINOR.PATCH, then bump PATCH. Sorted with -V
          # on the major and numerically on minor/patch so v0.10.0 > v0.9.9.
          latest=$(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                   | sort -t. -k1,1V -k2,2n -k3,3n | tail -1 || true)
          if [ -z "$latest" ]; then
            next=v0.0.1
          else
            IFS=. read -r maj min pat <<<"${latest#v}"
            next="v$maj.$min.$((pat + 1))"   # the v is stripped to parse; put it back
          fi
          echo "latest=${latest:-none}  next=$next"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.decide.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      # Never tag a red main. The `ci` workflow runs on this same push; this is a
      # deliberate second run so the job is self-contained and cannot tag a
      # commit whose tests it has not seen pass.
      - name: Test
        if: steps.decide.outputs.skip != 'true'
        run: go test -race ./...

      - name: Tag and publish
        if: steps.decide.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --latest
          echo "released $VERSION — https://github.com/${GITHUB_REPOSITORY}/releases/tag/$VERSION" \
            >> "$GITHUB_STEP_SUMMARY"
