name: traffic-stats

# Preserves GitHub's repo traffic (views / clones / referrers / paths) past the
# 14-day window GitHub itself retains. Runs silently: all data plus a generated
# report live on a separate `github-repo-stats` branch — nothing is published to
# Pages or merged to main. When you're ready to present numbers, share that
# branch's report (or wire it into a dashboard). Collection starts the day this
# lands; it cannot backfill days before that.

on:
  schedule:
    - cron: "17 4 * * *" # daily ~04:17 UTC, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write # push the snapshot to the data branch

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      # @RELEASE is the maintainer's moving "latest stable" tag; pin to a SHA if
      # you want it frozen. The traffic API (referrers/clones/views) is NOT
      # accessible with the default GITHUB_TOKEN — it 403s "Resource not
      # accessible by integration". A PAT is required: create a classic token
      # with `repo` scope (or a fine-grained token with Administration:read +
      # Contents:read/write on this repo), then add it as the GHRS_PAT secret.
      - uses: jgehrcke/github-repo-stats@RELEASE
        with:
          ghtoken: ${{ secrets.GHRS_PAT }}
