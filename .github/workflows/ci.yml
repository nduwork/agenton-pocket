name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So a branch can be checked before it has a PR:
  #   gh workflow run ci --ref <branch>
  workflow_dispatch:

# Tests only. Nothing is built in CI and no artifacts are published from here;
# release binaries are produced by the auto-release workflow. The iOS app is not
# built here either — no macOS runner; its compile check is
# ios/Tools/build-sim.sh, run locally.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
