name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So a branch can be checked before it has a PR:
  #   gh workflow run ci --ref <branch>
  workflow_dispatch:

# Tests only. Nothing is built in CI and no artifacts are published from here;
# versioning and GitHub Releases are handled by the release-please workflow. The
# iOS app is not built here either — no macOS runner; its compile check is
# ios/Tools/build-sim.sh, run locally.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `test` is a required status check, so the job must always run and report
      # green — but on docs-only changes we skip the actual Go work below.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!assets/**'
              - '!**/*.md'
              - '!LICENSE'
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: steps.changes.outputs.code == 'true'
        run: go vet ./...
      - if: steps.changes.outputs.code == 'true'
        run: go test -race ./...
