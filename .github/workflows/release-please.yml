name: release-please

# When a Conventional-Commit change lands on main, this opens (or updates) a
# "Release PR" that bumps the version and CHANGELOG.md. Nothing ships until you
# merge that PR — merging it tags vX.Y.Z and publishes a GitHub Release. This is
# the "maintainer decides when to release" gate.
#
# The org locks "Allow Actions to create PRs", so the default GITHUB_TOKEN can't
# open the Release PR. This uses a fine-grained PAT (RELEASE_PLEASE_TOKEN) scoped
# to this repo with Contents: RW + Pull requests: RW.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
