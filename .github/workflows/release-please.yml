name: release-please

# When a Conventional-Commit change lands on main, this opens (or updates) a
# "Release PR" that bumps the version and CHANGELOG.md. Nothing ships until you
# merge that PR — merging it tags vX.Y.Z and publishes a GitHub Release. This is
# the "maintainer decides when to release" gate.
#
# Uses only the automatic GITHUB_TOKEN; no secrets.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # When (and only when) release-please cut a release, build the binaries in the
  # same run. Calling release.yml here — rather than relying on the tag push —
  # is what actually fires goreleaser, since token-pushed tags don't trigger
  # workflows on their own.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
