name: Agenton
options:
  bundleIdPrefix: com.agenton
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"

targets:
  Agenton:
    type: application
    platform: iOS
    sources:
      - path: Agenton
    dependencies:
      - package: SwiftTerm
    info:
      path: Agenton/Info.plist
      properties:
        CFBundleDisplayName: Agenton Pocket
        # Let the build settings (MARKETING_VERSION / CURRENT_PROJECT_VERSION
        # below) drive the version, instead of literal values here that would
        # override them. Bump the build number in CURRENT_PROJECT_VERSION for
        # every TestFlight upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App uses only standard/exempt networking (plain ws:// over Tailscale,
        # which does its own transport encryption); attest no non-exempt
        # encryption so App Store Connect stops prompting.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The app only ever talks to a user-supplied daemon over a Tailscale
        # (100.64/10) or LAN address with a plain ws:// bridge — cleartext is the
        # design, not a shortcut: Tailscale already encrypts the wire, and agenton
        # serves no TLS. ATS blocks cleartext by default, so allow it.
        # NSAllowsArbitraryLoads alone proved unreliable for ws:// to a *.ts.net
        # MagicDNS host on device (build 3 still tripped ATS), so also grant a
        # targeted per-domain exception for ts.net.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: "Agenton connects to your daemon over your local network or Tailscale."
        NSCameraUsageDescription: "Scan a QR code to connect to your agenton daemon."
        NSMicrophoneUsageDescription: "Hold Talk to dictate a message to the agent."
        NSSpeechRecognitionUsageDescription: "Speech is transcribed on-device to fill the message field."
    settings:
      base:
        # Placeholder bundle id — set your own before building to a device.
        # The Simulator ignores it, so a clean clone builds with no team/cert.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.agentonpocket
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "8"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # Simulator builds need no signing. For a device build, plug in your
        # own Apple team (Xcode → Signing & Capabilities → automatic).
        CODE_SIGN_STYLE: Automatic
  AgentonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AgentonTests
    dependencies:
      - target: Agenton
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.agentonpocket.tests
        SWIFT_VERSION: "5.0"
        # Unit-test bundle needs an Info.plist to code-sign on the Simulator;
        # let Xcode synthesize one (no file to maintain).
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Agenton:
    build:
      targets:
        Agenton: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentonTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
