# goreleaser builds the prebuilt agenton binaries that install.sh fetches.
# It runs from release.yml on the vX.Y.Z tag release-please creates, and the
# archive names here MUST match what install.sh downloads:
#   agenton_<version>_<os>_<arch>.tar.gz   (version has no leading v)
# Daemon only — the iOS app lives in its own repo and never releases from here.
version: 2

project_name: agenton

builds:
  - id: agenton
    main: ./cmd/agenton
    binary: agenton
    env:
      - CGO_ENABLED=0        # pure Go: lets one Linux runner cross-build darwin
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}   # stamps main.version (see cmd/agenton/main.go)

archives:
  - id: agenton
    formats: [tar.gz]
    # {{.Version}} is the tag without its leading v — matches install.sh.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Homebrew: publishes a cask to the nduwork/homebrew-tap repo so users can
#   brew install nduwork/tap/agenton
# A cask (not a formula) is the current goreleaser way to ship a prebuilt
# binary, and it strips macOS's Gatekeeper quarantine flag so the unsigned
# binary runs. Requires a HOMEBREW_TAP_TOKEN secret (a PAT with write access to
# the tap repo); the default GITHUB_TOKEN can't push to another repo. When the
# token is absent the step is skipped, so a release without it still succeeds.
homebrew_casks:
  - name: agenton
    skip_upload: '{{ if eq (index .Env "HOMEBREW_TAP_TOKEN") "" }}true{{ else }}false{{ end }}'
    repository:
      owner: nduwork
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/nduwork/agenton-pocket"
    description: "Local agent daemon (TUI + web), reachable from your phone over Tailscale"
