# goreleaser builds the prebuilt agenton binaries that install.sh fetches.
# It runs from release.yml on the vX.Y.Z tag release-please creates, and the
# archive names here MUST match what install.sh downloads:
#   agenton_<version>_<os>_<arch>.tar.gz   (version has no leading v)
# Daemon only — the iOS app lives in its own repo and never releases from here.
version: 2

project_name: agenton

builds:
  - id: agenton
    main: ./cmd/agenton
    binary: agenton
    env:
      - CGO_ENABLED=0        # pure Go: lets one Linux runner cross-build darwin
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}   # stamps main.version (see cmd/agenton/main.go)

# macOS code-signing + notarization. Runs on the Linux runner (goreleaser signs
# and notarizes Mach-O via the embedded quill — no macOS runner needed), before
# archiving, so the tarballs and deb/rpm all carry the signed binary. Without this,
# macOS Gatekeeper blocks the unsigned binary ("cannot verify … free of
# malware"). Self-skips when the signing secrets are absent, so a release
# without them still succeeds. See docs/RELEASING.md for how to set the secrets.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [agenton]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"       # base64 of the Developer ID .p12
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"     # .p12 export password
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}" # App Store Connect API issuer UUID
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"       # App Store Connect API key ID
        key: "{{ .Env.MACOS_NOTARY_KEY }}"             # base64 of the .p8 API key
        wait: true
        timeout: 20m

archives:
  - id: agenton
    formats: [tar.gz]
    # {{.Version}} is the tag without its leading v — matches install.sh.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Linux packages: .deb (apt/dpkg) and .rpm (dnf/yum). agenton is a per-user
# agent, not a root system daemon, so there's no systemd unit — the package just
# installs the binary to /usr/bin. Install a downloaded file with, e.g.,
#   sudo apt install ./agenton_<ver>_linux_amd64.deb
nfpms:
  - id: agenton
    package_name: agenton
    formats: [deb, rpm]
    maintainer: "nduwork <nduwork@users.noreply.github.com>"
    homepage: "https://github.com/nduwork/agenton-pocket"
    description: "Local agent daemon (TUI + web), reachable from your phone over Tailscale"
    license: "GPL-3.0-only"
    bindir: /usr/bin
